name: Publish

# Tags are prefixed myfokus-v rather than v so they can never collide with the upstream release
# tags this fork inherited (v1.0.0 ... v17.0.0), including any that arrive in a future rebase.
on:
  push:
    tags:
      - 'myfokus-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). Without it npm falls back to looking for a
      # token and the publish step fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs Node >= 22.14.0; .nvmrc pins 22.22.3.
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm bundled with Node 22.
      # Pinned to the 11 line so a future npm major cannot silently change OIDC behaviour, and so
      # it matches the npm that wrote package-lock.json.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Check the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#myfokus-v}"
          package_version="$(node -p "require('./src/framework/theme/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match theme version ${package_version}" >&2
            exit 1
          fi

      - run: npm run build:myfokus

      # Not test:myfokus - the theme suite is red on upstream too, so gating the release on it
      # would mean no release ever publishes. See the note in pr-check.yml.
      - run: npm run test:myfokus-ci

      - run: npm run publish:myfokus
