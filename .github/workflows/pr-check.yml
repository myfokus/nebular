name: PR check

# Replaces upstream's pr-check.yml. Upstream builds every package, the docs site, the playground
# and a BrowserStack e2e/unit matrix using akveo's own hardcoded BrowserStack credentials - none of
# which this fork maintains or is entitled to use. This job checks the three packages we publish.
#
# Keep this file diverged. If a rebase onto upstream conflicts here, resolve it in favour of this
# version rather than taking upstream's.
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # package-lock.json is written by npm 11, which records optional and peer dependencies
      # differently from the npm 10 that ships with Node 22. Without this, npm ci rejects the
      # lockfile as incomplete ("Missing: readdirp@... from lock file") even though it is in sync.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run lint

      - run: npm run build:myfokus

      # Deliberately not test:myfokus. The theme suite is red on upstream v17.0.0 too (162 failing
      # there, 101 here - see "Test suite state" in the README), so gating on it would mean a
      # permanently red CI that nobody reads. Run the suites that are actually green and judge the
      # theme suite by the failure *diff* against a baseline, locally, when changing it.
      - run: npm run test:myfokus-ci

      - uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: 'dist/'
          retention-days: 1
